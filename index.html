<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/components/ui/favicon.ico" />
    <title>Acesso ao Portal | BS Construtora</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #ffffff;
            color: #333;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #000;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: #64748b;
        }
        .disclaimer {
            margin-top: 20px;
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.5;
            padding: 10px;
            background-color: #f8fafc;
            border-radius: 6px;
        }
        .error {
            color: #ef4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Acesso ao Portal</h1>
        
        <form id="loginForm">
            <input type="password" id="password" placeholder="Senha de acesso" required autofocus>
            <button type="submit">OK</button>
        </form>
        <div id="error" class="error">Senha incorreta.</div>

        <div class="footer">
            Central de Controle Modelo Marketing
        </div>

        <div class="disclaimer">
            Este é um ambiente controlado apenas para utilização de pessoas específicas proprietárias da marca, sendo bloqueado o uso de qualquer conteúdo audiovisual externamente.
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');
            
            if (password === 'BS2025') {
                window.location.href = '/portal.html';
            } else {
                errorDiv.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
